[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-manager"
version = "0.1.0"
description = "Keeps Claude Code Remote Control sessions alive inside tmux"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oleksii Shkurpela" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["claude", "claude-code", "remote-control", "tmux"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/Alexshl/claude-manager"
Issues = "https://github.com/Alexshl/claude-manager/issues"

[project.scripts]
cm = "cm.cli:main"

[tool.setuptools]
packages = ["cm"]

[tool.setuptools.package-data]
cm = ["service/*.tmpl"]
